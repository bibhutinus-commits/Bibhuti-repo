<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src &apos;none&apos;; script-src &apos;sha256-lf2nFgFKXsskIfa6I2GttMfxhh0+rzPoU/suwdA4AU0=&apos;; style-src &apos;unsafe-inline&apos;; connect-src https://formsubmit.co; base-uri &apos;none&apos;; form-action &apos;none&apos;">
<title>IT PMO – Project Board (Demo)</title>
<style>
/* Layout concept: navy control header with a proportional status bar, a slim toolbar (view switch + filters),
   then either four open status lanes (Board) or a due-date axis grouped by project (Timeline). */
:root {
  --navy: #0a1a33;
  --navy-2: #12305f;
  --blue: #1f5eff;
  --blue-deep: #0a3a9e;
  --blue-wash: #e6edff;
  --ink: #14202f;
  --ink-soft: #566176;
  --line: #d3d9e2;
  --line-soft: #e4e8ee;
  --surface: #ffffff;
  --paper: #eceff3;
  --red: #c62828;
  --red-bg: #fdeaea;
  --amber: #f2a900;
  --amber-bg: #fff2d1;
  --amber-ink: #7a4b00;
  --grey-bg: #e9edf2;
  --green: #1c8a5a;
  --wa-green: #128c4a;
  --wa-green-dark: #0b6e38;
  --st-backlog: #7b8799;
  --st-progress: #1f5eff;
  --st-blocked: #e0572a;
  --st-done: #1c8a5a;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --radius: 8px;
  --radius-sm: 5px;
  --shadow: 0 1px 2px rgba(10, 26, 51, .07);
  --shadow-lift: 0 10px 24px rgba(10, 26, 51, .16), 0 2px 4px rgba(10, 26, 51, .08);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: Bahnschrift, "DIN Alternate", "Arial Narrow", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --tl-label: 190px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--paper); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
button, select, input, textarea { font: inherit; color: inherit; }

/* ===== Header: wordmark, add button, status spread, figures ===== */
.app-header { background: var(--navy); color: #fff; padding: var(--sp-5) var(--sp-6) var(--sp-5); display: grid; grid-template-columns: 1fr auto; align-items: end; gap: var(--sp-4) var(--sp-5); border-bottom: 4px solid var(--blue); }
.wordmark { grid-column: 1; grid-row: 1; display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1; letter-spacing: .01em; }
.wordmark span { font-family: var(--font); font-weight: 400; font-size: 14px; color: rgba(255,255,255,.7); letter-spacing: 0; }
.app-header .btn { grid-column: 2; grid-row: 1; }
.spread { grid-column: 1 / -1; grid-row: 2; display: flex; gap: 3px; height: 10px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.1); }
.spread i { display: block; min-width: 6px; background: var(--seg); transition: flex-grow .3s ease; }
.summary { grid-column: 1 / -1; grid-row: 3; display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-6); margin: 0; padding: 0; list-style: none; }
.summary li { display: flex; align-items: baseline; gap: var(--sp-2); font-size: 14px; color: rgba(255,255,255,.78); }
.summary b { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.summary li::before { content: ""; align-self: center; width: 9px; height: 9px; border-radius: 50%; background: var(--seg, rgba(255,255,255,.5)); order: -1; }
.summary li.warn b { color: #ffb4a8; }
.summary li.warn { color: #ffd6cf; }

.btn { border: 1px solid var(--blue); background: var(--blue); color: #fff; padding: 10px var(--sp-5); border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; min-height: 44px; transition: background .15s, border-color .15s, transform .15s; }
.btn:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .65; cursor: progress; }
.btn.secondary { background: var(--surface); color: var(--blue-deep); border-color: var(--line); }
.btn.secondary:hover { background: var(--blue-wash); border-color: var(--blue); }
.app-header .btn { background: #fff; color: var(--navy); border-color: #fff; }
.app-header .btn:hover { background: var(--blue-wash); border-color: var(--blue-wash); }

/* ===== Toolbar: view switch + filters ===== */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-5); align-items: flex-end; padding: var(--sp-3) var(--sp-6); background: var(--surface); border-bottom: 1px solid var(--line); }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.views button { border: 0; background: var(--surface); padding: 10px var(--sp-5); min-height: 44px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
.views button + button { border-left: 1px solid var(--line); }
.views button:hover { background: var(--blue-wash); }
.views button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.filters { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: flex-end; flex: 1 1 auto; }
.filters label { display: flex; flex-direction: column; font-size: 13px; font-weight: 600; color: var(--ink-soft); gap: var(--sp-1); }
.filters select, .filters input { padding: 8px var(--sp-3); min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); min-width: 170px; color: var(--ink); font-size: 14px; }
.filters select:hover, .filters input:hover { border-color: var(--st-backlog); }
.note { margin-left: auto; font-size: 13px; color: var(--ink-soft); align-self: center; max-width: 34ch; }

/* ===== Board: open lanes with a status rule ===== */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-5); padding: var(--sp-5) var(--sp-6) var(--sp-6); align-items: start; }
.board[hidden], .timeline[hidden] { display: none; }
.column { --lane: var(--st-backlog); min-width: 0; border-top: 4px solid var(--lane); padding: var(--sp-3) var(--sp-2) var(--sp-2); min-height: 240px; border-radius: 0 0 var(--radius) var(--radius); outline: 2px dashed transparent; outline-offset: 2px; transition: background .12s, outline-color .12s; }
.column[data-status="In Progress"] { --lane: var(--st-progress); }
.column[data-status="Blocked"] { --lane: var(--st-blocked); }
.column[data-status="Done"] { --lane: var(--st-done); }
.column.drop-target { background: var(--blue-wash); outline-color: var(--blue); }
.col-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 var(--sp-3); }
.col-head h2 { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin: 0; color: var(--ink); }
.badge { font-family: var(--font-display); font-size: 21px; font-weight: 600; color: var(--lane); font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-soft); font-size: 14px; padding: var(--sp-5) var(--sp-4); border: 1px dashed var(--st-backlog); border-radius: var(--radius); }

/* ===== Cards ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--sp-4); margin-bottom: var(--sp-3); cursor: grab; transition: box-shadow .15s, border-color .15s; }
.card:hover { box-shadow: var(--shadow-lift); border-color: var(--st-backlog); }
.card.dragging { opacity: .45; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); }
.task-id { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--ink-soft); }
.card h3 { font-family: var(--font); font-size: 16px; line-height: 1.35; font-weight: 650; margin: var(--sp-2) 0 0; overflow-wrap: anywhere; }
.meta { margin: 0; padding: var(--sp-3) 0 0; list-style: none; font-size: 13.5px; color: var(--ink-soft); display: grid; gap: 5px; }
.meta li { display: flex; align-items: flex-start; gap: var(--sp-2); overflow-wrap: anywhere; min-width: 0; }
.meta svg { flex: none; width: 15px; height: 15px; margin-top: 3px; stroke: var(--st-backlog); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: var(--sp-3) 0 0; }
.pill, .tag, .overdue { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill-critical { background: var(--red-bg); color: var(--red); }
.pill-high { background: var(--amber-bg); color: var(--amber-ink); }
.pill-medium { background: var(--blue-wash); color: var(--blue-deep); }
.pill-low { background: var(--grey-bg); color: #46516a; }
.tag { background: var(--paper); color: var(--ink-soft); }
.overdue { background: var(--red); color: #fff; }
.card-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-top: var(--sp-3); padding-top: var(--sp-3); border-top: 1px solid var(--line-soft); }
.card-actions select { font-size: 13px; padding: 6px var(--sp-2); min-height: 36px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper); cursor: pointer; }
.icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; min-width: 36px; min-height: 36px; border-radius: var(--radius-sm); color: var(--ink-soft); }
.icon-btn:hover { background: var(--red-bg); color: var(--red); }
.confirm { display: flex; align-items: center; gap: var(--sp-2); font-size: 13px; color: var(--red); font-weight: 600; }
.confirm button { border: 1px solid var(--line); background: #fff; border-radius: var(--radius-sm); padding: 4px 12px; min-height: 36px; cursor: pointer; font-size: 13px; }
.confirm .yes { background: var(--red); color: #fff; border-color: var(--red); }

/* ===== Timeline: due dates on a weekly axis, one row per project ===== */
.timeline { margin: var(--sp-5) var(--sp-6) var(--sp-6); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.tl-scroll { overflow-x: auto; border-radius: var(--radius); }
.tl-grid { min-width: 100%; }
.tl-row { display: flex; border-top: 1px solid var(--line-soft); }
.tl-row:first-child { border-top: 0; }
.tl-name { position: sticky; left: 0; z-index: 3; flex: none; width: var(--tl-label); padding: var(--sp-3) var(--sp-4); background: var(--surface); border-right: 1px solid var(--line); font-weight: 650; font-size: 14px; line-height: 1.3; }
.tl-name small { display: block; margin-top: 2px; font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.tl-track { position: relative; flex: none; background-image: linear-gradient(to right, var(--line-soft) 1px, transparent 1px); background-size: calc(var(--ppd) * 7) 100%; }
.tl-head .tl-name { font-family: var(--font-display); font-size: 15px; color: var(--ink-soft); }
.tl-head .tl-track { height: 44px; background-image: none; }
.tl-tick { position: absolute; top: 0; bottom: 0; padding: 12px 0 0 6px; border-left: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--amber); z-index: 1; }
.tl-today-label { position: absolute; top: 4px; transform: translateX(-50%); background: var(--amber); color: #2b1d00; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; z-index: 2; }
.tl-item { position: absolute; z-index: 2; display: flex; align-items: center; gap: 7px; max-width: 230px; height: 26px; padding-right: 8px; border-radius: 999px; cursor: default; }
.tl-item:hover, .tl-item:focus-visible { z-index: 4; background: var(--surface); box-shadow: var(--shadow-lift); }
.tl-dot { flex: none; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--c); border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--c); }
.tl-item.late .tl-dot { box-shadow: 0 0 0 1.5px var(--red); background: var(--red); border-color: #fff; }
.tl-item.is-done .tl-dot { background: var(--surface); border-color: var(--c); box-shadow: none; }
.tl-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.tl-item.late .tl-text { color: var(--red); font-weight: 600; }
.tl-key { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
.tl-key span { display: inline-flex; align-items: center; gap: 7px; }
.tl-key i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); }
.tl-empty { padding: var(--sp-6); color: var(--ink-soft); }

/* ===== Modal form ===== */
dialog { border: 0; border-radius: 12px; padding: 0; width: min(580px, 94vw); box-shadow: 0 24px 60px rgba(10,26,51,.4); overflow: hidden; }
dialog::backdrop { background: rgba(10, 26, 51, .62); }
.dlg-head { background: var(--navy); color: #fff; padding: var(--sp-4) var(--sp-5); display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--blue); }
.dlg-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.dlg-head .icon-btn { color: #fff; font-size: 24px; }
.dlg-head .icon-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
form { padding: var(--sp-5); display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); max-height: 78vh; overflow-y: auto; }
.field { display: flex; flex-direction: column; gap: var(--sp-1); }
.field.full { grid-column: 1 / -1; }
.field label { font-weight: 600; font-size: 13px; color: var(--ink-soft); }
.field input, .field select, .field textarea { padding: 9px var(--sp-3); min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); }
.field .invalid { border-color: var(--red); background: var(--red-bg); }
.field textarea { min-height: 84px; resize: vertical; }
.error { color: var(--red); font-size: 13px; }
.hint { color: var(--ink-soft); font-size: 12px; }
.form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--sp-2); padding-top: var(--sp-2); }

/* ===== Toasts ===== */
.toasts { position: fixed; bottom: 88px; right: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); z-index: 50; max-width: 90vw; }
.toast { background: var(--green); color: #fff; padding: var(--sp-3) var(--sp-4); border-radius: var(--radius); box-shadow: var(--shadow-lift); font-weight: 600; }
.toast.warn { background: var(--amber); color: #1b1300; }

/* ===== WhatsApp floating widget ===== */
.wa-fab { position: fixed; right: var(--sp-5); bottom: var(--sp-5); z-index: 40; display: inline-flex; align-items: center; gap: var(--sp-2); padding: 12px 18px 12px 14px; min-height: 48px; border-radius: 999px; background: var(--wa-green); color: #fff; font-weight: 600; text-decoration: none; box-shadow: 0 6px 18px rgba(7, 94, 84, .4); transition: background .15s, box-shadow .15s; }
.wa-fab:hover { background: var(--wa-green-dark); box-shadow: 0 10px 24px rgba(7, 94, 84, .5); }
.wa-fab svg { width: 26px; height: 26px; fill: currentColor; flex: none; }

/* ===== Responsive ===== */
@media (max-width: 1100px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 767px) {
  .board { grid-template-columns: 1fr; padding: var(--sp-3); }
  .timeline { margin: var(--sp-3); }
  .app-header, .toolbar { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .wordmark { font-size: 32px; }
  .wordmark span { flex-basis: 100%; }
  .summary { gap: var(--sp-3) var(--sp-5); }
  .filters label, .filters select, .filters input { width: 100%; }
  .filters label { flex: 1 1 100%; }
  .views { width: 100%; }
  .views button { flex: 1; }
  form { grid-template-columns: 1fr; }
  .note { margin-left: 0; max-width: none; }
  .wa-fab span { display: none; }
  .wa-fab { padding: 12px; }
  :root { --tl-label: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .btn, .column, .spread i, .wa-fab { transition: none; }
}
</style>
</head>
<body>

<!-- ===== Header with live summary strip ===== -->
<header class="app-header">
  <div class="wordmark">IT PMO <span>Project board, internal demo</span></div>
  <button type="button" class="btn" id="openAdd">Add task</button>
  <div class="spread" id="spread" role="img" aria-label="Task split by status"></div>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
</header>

<!-- ===== Toolbar: view switch + filters ===== -->
<div class="toolbar">
  <div class="views" role="group" aria-label="View">
    <button type="button" data-view="board" aria-pressed="true">Board</button>
    <button type="button" data-view="timeline" aria-pressed="false">Timeline</button>
  </div>
  <section class="filters" aria-label="Filters">
    <label for="fProject">Project
      <select id="fProject"><option value="">All projects</option></select>
    </label>
    <label for="fAssignee">Assignee
      <input id="fAssignee" type="text" placeholder="Search by name">
    </label>
    <label for="fPriority">Priority
      <select id="fPriority"><option value="">All priorities</option></select>
    </label>
    <button type="button" class="btn secondary" id="clearFilters">Clear filters</button>
  </section>
  <span class="note">Demo only, not an official channel. Data lives in memory; refreshing resets the board. New tasks are emailed via formsubmit.co, so do not enter real project data.</span>
</div>

<main>
  <!-- ===== Kanban board (columns rendered by renderBoard) ===== -->
  <section class="board" id="board" aria-label="Kanban board"></section>
  <!-- ===== Timeline (rendered by renderTimeline) ===== -->
  <section class="timeline" id="timeline" aria-label="Timeline by due date" hidden></section>
</main>

<!-- ===== Add Task modal ===== -->
<dialog id="addDialog" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <h2 id="dlgTitle">Add Task</h2>
    <button type="button" class="icon-btn" id="closeAdd" aria-label="Close add task form">×</button>
  </div>
  <form id="taskForm" novalidate>
    <div class="field full">
      <label for="title">Task Title *</label>
      <input id="title" name="title" type="text" maxlength="80" aria-describedby="err-title">
      <div class="error" id="err-title"></div>
    </div>
    <div class="field full">
      <label for="description">Description</label>
      <textarea id="description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
      <div class="hint">Optional, up to 500 characters.</div>
      <div class="error" id="err-description"></div>
    </div>
    <div class="field">
      <label for="project">Project / Workstream</label>
      <select id="project" name="project"></select>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category" name="category"></select>
    </div>
    <div class="field">
      <label for="assignee">Assignee *</label>
      <input id="assignee" name="assignee" type="text" maxlength="60" aria-describedby="err-assignee">
      <div class="error" id="err-assignee"></div>
    </div>
    <div class="field">
      <label for="priority">Priority</label>
      <select id="priority" name="priority"></select>
    </div>
    <div class="field">
      <label for="dueDate">Due Date *</label>
      <input id="dueDate" name="dueDate" type="date" aria-describedby="err-dueDate">
      <div class="error" id="err-dueDate"></div>
    </div>
    <div class="field">
      <label for="status">Status</label>
      <select id="status" name="status"></select>
    </div>
    <div class="form-actions">
      <button type="button" class="btn secondary" id="cancelAdd">Cancel</button>
      <button type="submit" class="btn" id="submitBtn">Add Task</button>
    </div>
  </form>
</dialog>

<!-- ===== WhatsApp floating widget (href is set from WHATSAPP_NUMBER in the script) ===== -->
<a class="wa-fab" id="waFab" href="#" target="_blank" rel="noopener noreferrer" aria-label="Chat with IT PMO on WhatsApp">

<!-- ===== Toast region (aria-live) ===== -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!--
  CONFIG NOTE: FormSubmit requires a ONE-TIME ACTIVATION. The first submission
  to a new address triggers a confirmation email to that address; submissions
  only deliver after the link in that email is clicked.
  Change FORMSUBMIT_ENDPOINT (first constant in the script below) to your address.
-->
<script>
"use strict";

/* Framing guard: GitHub Pages cannot send frame-ancestors, so refuse to run inside a frame. */
if (window.top !== window.self) { document.documentElement.hidden = true; window.top.location = window.self.location; }

/* =====================================================================
   CONFIG — swap YOUR_EMAIL@example.com here; it is used nowhere else.
   ===================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* WhatsApp contact for the floating widget: digits only, international format. A plain link, not a network call. */
const WHATSAPP_NUMBER = "6581639161";
const WHATSAPP_MESSAGE = "Hi IT PMO team, I have a question about the project board.";

/* ===== Constants ===== */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ===== Date helpers (all local time, dates as YYYY-MM-DD strings) ===== */
function toISODate(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function todayISO() { return toISODate(new Date()); }
function offsetDate(days) { const d = new Date(); d.setDate(d.getDate() + days); return toISODate(d); }
function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function isOverdue(task) { return task.status !== "Done" && task.dueDate < todayISO(); }

/* ===== State: single source of truth (in memory only) ===== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  view: "board",           // "board" | "timeline"
  nextId: 1,
  confirmDeleteId: null,   // transient UI state: which card shows "Delete? Yes / No"
  dragId: null,
  dropStatus: null
};

/* ===== Seed data (dates relative to today so Overdue demo always works) ===== */
function seedTasks() {
  const t = (title, description, project, category, assignee, priority, due, status) =>
    ({ id: makeId(), title, description, project, category, assignee, priority, dueDate: offsetDate(due), status });
  state.tasks = [
    t("Migrate FX pricing service to AWS", "Lift and re-platform the FX pricing microservice; cutover rehearsal pending.", "Infrastructure & Cloud", "Infrastructure", "Daniel Tan", "High", 21, "In Progress"),
    t("Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to teller VDI images across all branches.", "Cybersecurity Uplift", "Cybersecurity", "Priya Nair", "Critical", -2, "In Progress"),
    t("UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for the 4.2 onboarding journey.", "Digital Channels", "Application Development", "Sarah Lim", "High", 5, "Blocked"),
    t("Define data retention schedule for CRM", "Align retention rules with the compliance team's policy update.", "Data & Analytics", "Compliance", "Marcus Wong", "Medium", 30, "Backlog"),
    t("Core ledger upgrade – regression test plan", "Draft the regression scope and test environment booking.", "Core Banking Upgrade", "Application Development", "Aisha Rahman", "High", 14, "Backlog"),
    t("Renew SIEM vendor support contract", "Awaiting revised quote from vendor; procurement approval needed.", "Vendor Management", "Vendor", "Kenneth Ong", "Medium", -5, "Blocked"),
    t("Decommission legacy reporting server", "Archive data and power off the 2014-era reporting host.", "Infrastructure & Cloud", "Infrastructure", "Daniel Tan", "Low", 45, "Backlog"),
    t("Quarterly privileged access review", "Completed access recertification for core banking admins.", "Cybersecurity Uplift", "Compliance", "Priya Nair", "Medium", -10, "Done")
  ];
}

/* ===== Utilities ===== */
function makeId() { return "UOB-ITPM-" + String(state.nextId++).padStart(4, "0"); }

/* Escape every user-supplied string before it is placed in HTML. */
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const $ = id => document.getElementById(id);

/* ===== Filtering (pure, client-side) ===== */
function applyFilters(tasks) {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return tasks.filter(t =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle)));
}

/* ===== Rendering ===== */
const ICON_PROJECT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M2 6h12M6 6v8"/></svg>';
const ICON_PERSON = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.7"/><path d="M2.5 14c.4-3 2.6-4.5 5.5-4.5s5.1 1.5 5.5 4.5"/></svg>';
const ICON_CALENDAR = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/></svg>';

const STATUS_COLOR = { "Backlog": "var(--st-backlog)", "In Progress": "var(--st-progress)", "Blocked": "var(--st-blocked)", "Done": "var(--st-done)" };

function renderSummary() {
  const total = state.tasks.length;
  const overdue = state.tasks.filter(isOverdue).length;
  const parts = [`<li><b>${total}</b>Total</li>`];
  const spread = [];
  STATUSES.forEach(s => {
    const n = state.tasks.filter(t => t.status === s).length;
    parts.push(`<li style="--seg:${STATUS_COLOR[s]}"><b>${n}</b>${escapeHtml(s)}</li>`);
    if (n) spread.push(`<i style="flex-grow:${n};--seg:${STATUS_COLOR[s]}"></i>`);
  });
  parts.push(`<li class="${overdue ? "warn" : ""}"><b>${overdue}</b>Overdue</li>`);
  $("summary").innerHTML = parts.join("");
  $("spread").innerHTML = spread.join("");
}

function renderCard(task) {
  const pKey = task.priority.toLowerCase();
  const confirming = state.confirmDeleteId === task.id;
  const moveOptions = STATUSES.filter(s => s !== task.status)
    .map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  const actions = confirming
    ? `<div class="confirm" role="group" aria-label="Confirm delete ${escapeHtml(task.id)}">Delete?
         <button type="button" class="yes" data-action="delete-yes" data-id="${escapeHtml(task.id)}">Yes</button>
         <button type="button" data-action="delete-no" data-id="${escapeHtml(task.id)}">No</button></div>`
    : `<button type="button" class="icon-btn" data-action="delete-ask" data-id="${escapeHtml(task.id)}" aria-label="Delete task ${escapeHtml(task.id)}">×</button>`;
  return `
  <article class="card p-${pKey}${state.dragId === task.id ? " dragging" : ""}" draggable="true" data-id="${escapeHtml(task.id)}">
    <div class="card-top">
      <span class="task-id">${escapeHtml(task.id)}</span>
      ${isOverdue(task) ? '<span class="overdue">Overdue</span>' : ""}
    </div>
    <h3>${escapeHtml(task.title)}</h3>
    <div class="pills">
      <span class="pill pill-${pKey}">${escapeHtml(task.priority)} priority</span>
      <span class="tag">${escapeHtml(task.category)}</span>
    </div>
    <ul class="meta">
      <li>${ICON_PROJECT}${escapeHtml(task.project)}</li>
      <li>${ICON_PERSON}${escapeHtml(task.assignee)}</li>
      <li>${ICON_CALENDAR}Due ${escapeHtml(formatDate(task.dueDate))}</li>
    </ul>
    <div class="card-actions">
      <select data-action="move" data-id="${escapeHtml(task.id)}" aria-label="Move ${escapeHtml(task.id)} to another column">
        <option value="">Move ▸</option>${moveOptions}
      </select>
      ${actions}
    </div>
  </article>`;
}

/* Only this function writes card/column markup; everything else changes state then calls it. */
function renderBoard() {
  const visible = applyFilters(state.tasks);
  $("board").innerHTML = STATUSES.map(status => {
    const cards = visible.filter(t => t.status === status);
    return `
    <section class="column${state.dropStatus === status ? " drop-target" : ""}" data-status="${escapeHtml(status)}" aria-labelledby="h-${status.replace(/\s/g, "")}">
      <div class="col-head">
        <h2 id="h-${status.replace(/\s/g, "")}">${escapeHtml(status)}</h2>
        <span class="badge" aria-label="${cards.length} tasks">${cards.length}</span>
      </div>
      ${cards.length ? cards.map(renderCard).join("") : '<div class="empty">No tasks</div>'}
    </section>`;
  }).join("");
  renderTimeline(visible);
  $("board").hidden = state.view !== "board";
  $("timeline").hidden = state.view !== "timeline";
  document.querySelectorAll(".views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
  renderSummary();
}

/* Timeline: one row per project, each task a dot placed on its due date. Rendered only from renderBoard. */
const TL_PPD = 20;          // pixels per day
const TL_ITEM_W = 230;      // space reserved per task label when stacking
const TL_LANE_H = 32;

function parseISO(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISODate(d); }

function renderTimeline(visible) {
  const el = $("timeline");
  if (!visible.length) { el.innerHTML = '<div class="tl-empty">No tasks match the current filters.</div>'; return; }
  const today = todayISO();
  const dates = visible.map(t => t.dueDate).concat(today).sort();
  let start = addDays(dates[0], -7);
  start = addDays(start, -((parseISO(start).getDay() + 6) % 7));   // back to Monday
  const span = Math.max(daysBetween(start, dates[dates.length - 1]) + 14, 84);
  const width = span * TL_PPD;
  const x = iso => daysBetween(start, iso) * TL_PPD;
  const trackStyle = `width:${width}px;--ppd:${TL_PPD}px`;

  const ticks = [];
  for (let d = 0; d < span; d += 7) {
    const label = parseISO(addDays(start, d)).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    ticks.push(`<span class="tl-tick" style="left:${d * TL_PPD}px">${escapeHtml(label)}</span>`);
  }
  const todayX = x(today);
  const head = `<div class="tl-row tl-head"><div class="tl-name">Due date</div>
    <div class="tl-track" style="${trackStyle}">${ticks.join("")}<i class="tl-today" style="left:${todayX}px"></i><span class="tl-today-label" style="left:${todayX}px">Today</span></div></div>`;

  const rows = PROJECTS.filter(p => visible.some(t => t.project === p)).map(project => {
    const items = visible.filter(t => t.project === project).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    const laneEnd = [];
    const html = items.map(t => {
      const left = x(t.dueDate);
      let lane = laneEnd.findIndex(end => end <= left - 7);
      if (lane === -1) { lane = laneEnd.length; laneEnd.push(0); }
      laneEnd[lane] = left + TL_ITEM_W;
      const late = isOverdue(t);
      const tip = `${t.id} · ${t.title} · ${t.status} · ${t.priority} priority · ${t.assignee} · due ${formatDate(t.dueDate)}${late ? " (overdue)" : ""}`;
      return `<div class="tl-item${late ? " late" : ""}${t.status === "Done" ? " is-done" : ""}" tabindex="0" style="left:${left}px;top:${8 + lane * TL_LANE_H}px;--c:${STATUS_COLOR[t.status]}" title="${escapeHtml(tip)}" aria-label="${escapeHtml(tip)}">
        <span class="tl-dot"></span><span class="tl-text">${escapeHtml(t.title)}</span></div>`;
    }).join("");
    const h = laneEnd.length * TL_LANE_H + 16;
    return `<div class="tl-row"><div class="tl-name">${escapeHtml(project)}<small>${items.length} task${items.length === 1 ? "" : "s"}</small></div>
      <div class="tl-track" style="${trackStyle};height:${h}px">${html}<i class="tl-today" style="left:${todayX}px"></i></div></div>`;
  }).join("");

  const key = STATUSES.map(s => `<span style="--c:${STATUS_COLOR[s]}"><i></i>${escapeHtml(s)}</span>`).join("")
    + '<span style="--c:var(--red)"><i></i>Overdue</span>';
  el.innerHTML = `<div class="tl-scroll"><div class="tl-grid" style="width:calc(var(--tl-label) + ${width}px)">${head}${rows}</div></div><div class="tl-key" aria-label="Legend">${key}</div>`;
}

/* ===== Mutations ===== */
function moveTask(id, status) {
  const task = state.tasks.find(t => t.id === id);
  if (!task || !STATUSES.includes(status) || task.status === status) return;
  task.status = status;
  renderBoard();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  state.confirmDeleteId = null;
  renderBoard();
}

function addTask(data) {
  const task = Object.assign({ id: makeId() }, data);
  state.tasks.push(task);
  renderBoard();
  return task;
}

/* ===== Toasts ===== */
function showToast(message, type) {
  const el = document.createElement("div");
  el.className = "toast" + (type === "warn" ? " warn" : "");
  el.textContent = message;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), type === "warn" ? 6000 : 3500);
}

/* ===== FormSubmit notification (never allowed to break the board) ===== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _honey: "",            // honeypot field: bots fill it, FormSubmit drops the message
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ===== Form: validation + submit ===== */
function readForm() {
  const f = $("taskForm");
  return {
    title: f.title.value.trim(),
    description: f.description.value.trim(),
    project: f.project.value,
    category: f.category.value,
    assignee: f.assignee.value.trim(),
    priority: f.priority.value,
    dueDate: f.dueDate.value,
    status: f.status.value
  };
}

function validate(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date must not be in the past.";
  return errors;
}

function showErrors(errors) {
  ["title", "description", "assignee", "dueDate"].forEach(name => {
    $("err-" + name).textContent = errors[name] || "";
    const input = $(name);
    input.classList.toggle("invalid", Boolean(errors[name]));
    if (errors[name]) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  });
}

function resetForm() {
  $("taskForm").reset();
  $("priority").value = "Medium";
  $("status").value = "Backlog";
  $("dueDate").min = todayISO();
  showErrors({});
}

async function handleSubmit(event) {
  event.preventDefault();
  const data = readForm();
  const errors = validate(data);
  showErrors(errors);
  const firstBad = Object.keys(errors)[0];
  if (firstBad) { $(firstBad).focus(); return; }

  const btn = $("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  // Optimistic UI: card appears immediately, network call runs after.
  const task = addTask(data);
  $("addDialog").close();
  resetForm();
  showToast(`Task ${task.id} added`);

  try {
    await notifyNewTask(task);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
  }
}

/* ===== Setup: populate selects ===== */
function fillSelect(select, values, firstOption) {
  select.innerHTML = (firstOption || "") + values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
}
function setupSelects() {
  fillSelect($("project"), PROJECTS);
  fillSelect($("category"), CATEGORIES);
  fillSelect($("priority"), PRIORITIES);
  fillSelect($("status"), STATUSES);
  fillSelect($("fProject"), PROJECTS, '<option value="">All projects</option>');
  fillSelect($("fPriority"), PRIORITIES, '<option value="">All priorities</option>');
}

/* ===== Event wiring ===== */
function setupEvents() {
  const board = $("board");

  // Card buttons and Move select (event delegation; board is re-rendered from state)
  board.addEventListener("click", e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "delete-ask") { state.confirmDeleteId = id; renderBoard(); }
    else if (btn.dataset.action === "delete-no") { state.confirmDeleteId = null; renderBoard(); }
    else if (btn.dataset.action === "delete-yes") deleteTask(id);
  });
  board.addEventListener("change", e => {
    const sel = e.target.closest('select[data-action="move"]');
    if (sel && sel.value) moveTask(sel.dataset.id, sel.value);
  });

  // Native HTML5 drag and drop
  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    state.dragId = card.dataset.id;
    e.dataTransfer.setData("text/plain", state.dragId);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging"); // no re-render here: it would cancel the drag
  });
  board.addEventListener("dragover", e => {
    const col = e.target.closest(".column");
    if (!col || !state.dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (state.dropStatus !== col.dataset.status) {
      state.dropStatus = col.dataset.status;
      board.querySelectorAll(".column").forEach(c => c.classList.toggle("drop-target", c === col));
    }
  });
  board.addEventListener("drop", e => {
    const col = e.target.closest(".column");
    if (!col || !state.dragId) return;
    e.preventDefault();
    const id = state.dragId;
    state.dragId = null;
    state.dropStatus = null;
    moveTask(id, col.dataset.status);
    renderBoard(); // also clears highlight if the card did not change column
  });
  board.addEventListener("dragend", () => {
    state.dragId = null;
    state.dropStatus = null;
    renderBoard();
  });

  // Filters
  const refilter = () => {
    state.filters.project = $("fProject").value;
    state.filters.priority = $("fPriority").value;
    state.filters.assignee = $("fAssignee").value;
    renderBoard();
  };
  ["fProject", "fPriority"].forEach(id => $(id).addEventListener("change", refilter));
  $("fAssignee").addEventListener("input", refilter);
  $("clearFilters").addEventListener("click", () => {
    $("fProject").value = ""; $("fPriority").value = ""; $("fAssignee").value = "";
    refilter();
  });

  // View switch (Board / Timeline)
  document.querySelector(".views").addEventListener("click", e => {
    const btn = e.target.closest("button[data-view]");
    if (btn) { state.view = btn.dataset.view; renderBoard(); }
  });

  // Add Task dialog
  $("openAdd").addEventListener("click", () => { resetForm(); $("addDialog").showModal(); $("title").focus(); });
  $("closeAdd").addEventListener("click", () => $("addDialog").close());
  $("cancelAdd").addEventListener("click", () => $("addDialog").close());
  $("taskForm").addEventListener("submit", handleSubmit);
}

/* ===== Init ===== */
function init() {
  $("waFab").href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(WHATSAPP_MESSAGE);
  setupSelects();
  seedTasks();
  setupEvents();
  resetForm();
  renderBoard();
}
init();
</script>
</body>
